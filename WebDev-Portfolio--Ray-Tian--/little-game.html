<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <style>
        body {
            background: #faf8ef;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #776e65;
        }
        #game-container {
            background: #bbada0;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        #score {
            background: #eee4da;
            color: #776e65;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 18px;
            display: inline-block;
        }
        #board {
            position: relative;
            width: 370px;
            height: 370px;
            background: #bbada0;
            border-radius: 10px;
            margin: 0 auto;
        }
        .cell-bg {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #cdc1b4;
            border-radius: 5px;
            left: 0;
            top: 0;
            pointer-events: none;
        }
        .tile {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #776e65;
            border-radius: 5px;
            transition: transform 0.18s cubic-bezier(.68,-0.55,.27,1.55), background 0.2s, color 0.2s;
            z-index: 2;
        }
        .tile.new {
            animation: pop 0.25s;
        }
        .tile.merged {
            animation: merge 0.25s;
        }
        @keyframes pop {
            0% { transform: scale(0.2); }
            80% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        @keyframes merge {
            0% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; }
        .tile-256 { background: #edcc61; color: #f9f6f2; }
        .tile-512 { background: #edc850; color: #f9f6f2; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; }
        #restart-btn {
            margin-top: 15px;
            padding: 8px 20px;
            background: #8f7a66;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #restart-btn:hover {
            background: #a39489;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(238, 228, 218, 0.95);
            padding: 40px 60px;
            border-radius: 10px;
            font-size: 32px;
            color: #776e65;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <h1>2048 Game</h1>
    <div id="game-container">
        <div id="score">Score: 0</div>
        <div id="board"></div>
        <button id="restart-btn">Restart</button>
        <div id="game-over">Game Over!</div>
    </div>
    <script>
        // Game variables
        const size = 4;
        let board = [];
        let score = 0;
        let isGameOver = false;
        let animating = false;
        // For animation: store previous board state
        let prevTiles = [];
        // Helper: get pixel position for a cell
        function getPos(row, col) {
            return {
                left: 10 + col * 90,
                top: 10 + row * 90
            };
        }
        // Initialize the game
        function initGame() {
            board = Array.from({ length: size }, () => Array(size).fill(0));
            score = 0;
            isGameOver = false;
            document.getElementById('game-over').style.display = 'none';
            prevTiles = [];
            addRandomTile();
            addRandomTile();
            updateBoard(true);
            updateScore();
        }
        // Add a random tile (2 or 4) to an empty cell
        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) emptyCells.push([r, c]);
                }
            }
            if (emptyCells.length === 0) return;
            const [row, col] = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[row][col] = Math.random() < 0.9 ? 2 : 4;
        }
        // Update the board UI with animation
        function updateBoard(isInit = false, moveMap = null, mergeMap = null, newTile = null) {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';
            // Draw background cells
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const bg = document.createElement('div');
                    bg.className = 'cell-bg';
                    const pos = getPos(r, c);
                    bg.style.left = pos.left + 'px';
                    bg.style.top = pos.top + 'px';
                    boardDiv.appendChild(bg);
                }
            }
            // Draw tiles
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) continue;
                    const tile = document.createElement('div');
                    tile.className = 'tile tile-' + board[r][c];
                    tile.textContent = board[r][c];
                    const pos = getPos(r, c);
                    tile.style.left = pos.left + 'px';
                    tile.style.top = pos.top + 'px';
                    // Animation classes
                    if (isInit) {
                        tile.classList.add('new');
                    } else if (mergeMap && mergeMap[r][c]) {
                        tile.classList.add('merged');
                    } else if (newTile && newTile[0] === r && newTile[1] === c) {
                        tile.classList.add('new');
                    }
                    boardDiv.appendChild(tile);
                }
            }
        }
        // Update the score UI
        function updateScore() {
            document.getElementById('score').textContent = 'Score: ' + score;
        }
        // Check if the game is over
        function checkGameOver() {
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) return false;
                    if (c < size - 1 && board[r][c] === board[r][c + 1]) return false;
                    if (r < size - 1 && board[r][c] === board[r + 1][c]) return false;
                }
            }
            return true;
        }
        // Move and merge logic with animation
        function move(direction) {
            if (animating || isGameOver) return;
            let moved = false;
            let mergeMap = Array.from({ length: size }, () => Array(size).fill(false));
            let moveMap = Array.from({ length: size }, () => Array(size).fill(null));
            let oldBoard = board.map(row => row.slice());
            // For each move, record where each tile comes from
            function slide(row, rowIdx, isCol = false) {
                let arr = row.filter(val => val);
                let mergedIdx = [];
                for (let i = 0; i < arr.length - 1; i++) {
                    if (arr[i] === arr[i + 1]) {
                        arr[i] *= 2;
                        score += arr[i];
                        arr[i + 1] = 0;
                        mergedIdx.push(i);
                    }
                }
                arr = arr.filter(val => val);
                while (arr.length < size) arr.push(0);
                // Mark merged
                mergedIdx.forEach(i => {
                    if (isCol) mergeMap[i][rowIdx] = true;
                    else mergeMap[rowIdx][i] = true;
                });
                return arr;
            }
            if (direction === 'left') {
                for (let r = 0; r < size; r++) {
                    const oldRow = board[r].slice();
                    const newRow = slide(board[r], r);
                    if (oldRow.toString() !== newRow.toString()) moved = true;
                    board[r] = newRow;
                }
            } else if (direction === 'right') {
                for (let r = 0; r < size; r++) {
                    const oldRow = board[r].slice();
                    let reversed = slide(board[r].slice().reverse(), r);
                    reversed.reverse();
                    if (oldRow.toString() !== reversed.toString()) moved = true;
                    board[r] = reversed;
                }
            } else if (direction === 'up') {
                for (let c = 0; c < size; c++) {
                    let col = [];
                    for (let r = 0; r < size; r++) col.push(board[r][c]);
                    const oldCol = col.slice();
                    let newCol = slide(col, c, true);
                    for (let r = 0; r < size; r++) board[r][c] = newCol[r];
                    if (oldCol.toString() !== newCol.toString()) moved = true;
                }
            } else if (direction === 'down') {
                for (let c = 0; c < size; c++) {
                    let col = [];
                    for (let r = 0; r < size; r++) col.push(board[r][c]);
                    const oldCol = col.slice();
                    let reversed = slide(col.reverse(), c, true);
                    reversed.reverse();
                    for (let r = 0; r < size; r++) board[r][c] = reversed[r];
                    if (oldCol.toString() !== reversed.toString()) moved = true;
                }
            }
            if (moved) {
                // Find the new tile position
                let before = oldBoard.flat();
                let after = board.flat();
                let newTile = null;
                for (let i = 0; i < after.length; i++) {
                    if (after[i] !== 0 && before[i] === 0) {
                        newTile = [Math.floor(i / size), i % size];
                        break;
                    }
                }
                animating = true;
                updateBoard(false, moveMap, mergeMap, newTile);
                setTimeout(() => {
                    addRandomTile();
                    updateBoard(false);
                    updateScore();
                    animating = false;
                    if (checkGameOver()) {
                        isGameOver = true;
                        document.getElementById('game-over').style.display = 'block';
                    }
                }, 180);
            }
        }
        // Mouse drag (swipe) support
        let startX, startY, isDragging = false;
        const boardDiv = document.getElementById('board');
        boardDiv.addEventListener('mousedown', function(e) {
            if (isGameOver) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });
        document.addEventListener('mouseup', function(e) {
            if (!isDragging) return;
            isDragging = false;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) move('right');
                else if (dx < -30) move('left');
            } else {
                if (dy > 30) move('down');
                else if (dy < -30) move('up');
            }
        });
        // Touch support for mobile
        boardDiv.addEventListener('touchstart', function(e) {
            if (isGameOver) return;
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
        });
        boardDiv.addEventListener('touchend', function(e) {
            if (isGameOver) return;
            const touch = e.changedTouches[0];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) move('right');
                else if (dx < -30) move('left');
            } else {
                if (dy > 30) move('down');
                else if (dy < -30) move('up');
            }
        });
        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (isGameOver) return;
            if (e.key === 'ArrowLeft') move('left');
            else if (e.key === 'ArrowRight') move('right');
            else if (e.key === 'ArrowUp') move('up');
            else if (e.key === 'ArrowDown') move('down');
        });
        // Restart button
        document.getElementById('restart-btn').onclick = initGame;
        // Start the game
        initGame();
    </script>
</body>
</html>
